<script id="pure">

const POLL_STALE_MS = 15000, HEARTBEAT_STALE_MS = 600000, CONNECT_TIMEOUT_MS = 10000;
const statusRoles = {active:'progress',waiting_user:'attention',blocked:'attention',done:'success',failed:'danger',idle:'neutral',dispatched:'progress',ready:'neutral',pending:'neutral',completed:'success'};
function displayTitle(title) {
 title=String(title ?? ''); const match=title.match(/^\[역할\]\s*([A-Z][A-Z0-9_]*)/);
 if(!match) return {role:null,text:title};
 let text=title.slice(match[0].length).replace(/^\s*\([^)]*\)/,'');
 const dash=text.indexOf(' — '); text=dash<0 ? text.replace(/^[\s.,:;·-]+/,'') : text.slice(dash+3);
 return {role:match[1],text:text.trim() || title};
}
function attentionOf(task,now) {
 if(['completed','failed'].includes(task.status)) return {severity:'none',signals:[]};
 const labels={failure:'직전 시도 실패',interruption:'중단됨',unverifiable:'Worker 확인 불가',stale:'응답 지연',root_completion:'완료 신호 수신',stale_heartbeat:'응답 지연'};
 const signals=[...new Set(task.worker?.attention || [])].map(code=>({code,label:labels[code] || '기타 신호',severity:['failure','interruption'].includes(code) ? 'danger' : code === 'stale' || (code === 'unverifiable' && task.status === 'dispatched') ? 'attention' : 'info'}));
 if(task.status === 'dispatched') {
  const stamp=task.worker?.lastHeartbeatAt || task.createdAt;
  if(Number.isFinite(Date.parse(stamp)) && now-Date.parse(stamp)>HEARTBEAT_STALE_MS) signals.push({code:'stale_heartbeat',label:'응답 지연',severity:'attention'});
 }
 const rank=['none','info','attention','danger'];
